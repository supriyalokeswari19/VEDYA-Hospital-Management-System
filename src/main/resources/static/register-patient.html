<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Patient Registration</title>

<link rel="stylesheet"
href="register-patient.css">

<link rel="icon"
type="image/png"
href="img/vedya.png">

</head>

<body>

<div class="container">

<img src="img/vedya.png" class="logo">

<h1>Patient Registration</h1>

<form id="patientForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="number"
id="age"
placeholder="Age"
required>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<input
type="text"
id="phone"
placeholder="Phone Number"
required>

<input
type="text"
id="address"
placeholder="Address"
required>

<input
type="text"
id="bloodGroup"
placeholder="Blood Group"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script src="register-patient.js"></script>
<script src="config.js"></script>
</body>

</html>
