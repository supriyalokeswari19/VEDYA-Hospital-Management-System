<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Doctor Registration</title>

<link rel="stylesheet"
href="register-doctor.css">

<link rel="icon"
type="image/png"
href="img/vedya.png">

</head>

<body>

<div class="container">
<br>
<img src="img/vedya.png" class="logo">

<h1>Doctor Registration</h1>

<form id="doctorForm">

<input
type="text"
id="name"
placeholder="Doctor Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="text"
id="specialization"
placeholder="Specialization"
required>

<input
type="number"
id="experience"
placeholder="Experience (Years)"
required>

<input
type="number"
id="fee"
placeholder="Consultation Fee"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script src="register-doctor.js"></script>

</body>

</html>
